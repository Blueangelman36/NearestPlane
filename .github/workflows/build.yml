name: Build APK

# Every push to main produces a downloadable APK. Pushing a v* tag also cuts a
# Release, which is the copy you want on your phone — release assets have a
# stable URL and don't expire, unlike workflow artifacts.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the release job, which runs on tags alone, can
# write — pull request builds never held a token that could publish.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk 37.2 is what the current Compose libraries require;
      # targetSdk stays 36. See app/build.gradle.kts.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.2 build-tools;36.0.0 platform-tools'

      # The repo has no Gradle wrapper — Android Studio generates one locally,
      # and its jar is a binary that doesn't belong in source control. CI runs a
      # pinned Gradle directly instead. AGP 9 needs Gradle 9.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      # A tag and versionName that disagree ship an APK whose own update check
      # announces the tag as newer than itself, forever.
      - name: The tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but versionName is $version"
            exit 1
          fi

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      # Without a stable key each run generates its own debug keystore, and the
      # phone then refuses every update as a signature mismatch — reported as a
      # bare "App not installed".
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret. Falling back to a per-run debug key; this build will NOT install over a previous one."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          # Unsigned only if the fallback above also failed to produce a key.
          src=app/build/outputs/apk/release/app-release.apk
          [ -f "$src" ] || src=app/build/outputs/apk/release/app-release-unsigned.apk
          cp "$src" "out/nearest-plane-${version}.apk"
          # Published so a failed install can be told apart from a bad download.
          (cd out && sha256sum "nearest-plane-${version}.apk" > SHA256SUMS)

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nearest-plane-apk
          path: out/
          retention-days: 90

  fences:
    # The recorded reasons in .fence/. Kotlin is read by fence's Rust build,
    # pinned to a commit; --strict fails on a removed statement and on any
    # note that build cannot compare.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Blueangelman36/chesterton@851632f80c0b326dd0dabb11c50e2467bd6e20a9
        with:
          implementation: rust

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, fences]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creating the release, and nothing else
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nearest-plane-apk
          path: out

      - name: Read the checksum
        id: sum
        run: echo "line=$(cat out/SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Release-build APK, self-signed, installable directly on a phone.

            **On your phone:** tap the `.apk` below, then allow installs from
            your browser when Android asks. No Android Studio, no USB cable.

            **Upgrading from v1.3 or earlier?** Uninstall the old one first.
            Everything up to v1.3 was signed with a throwaway key that changed
            on every build, so Android sees those as a different app and blocks
            the update. From v1.4 on, one key, and updates install cleanly.

            `SHA-256: ${{ steps.sum.outputs.line }}`
            Doesn't match what you downloaded? The download is truncated —
            that's a broken file, not a broken build.
