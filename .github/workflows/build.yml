name: Build APK

# Every push to main produces a downloadable APK. Pushing a v* tag also cuts a
# Release, which is the copy you want on your phone — release assets have a
# stable URL and don't expire, unlike workflow artifacts.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      # The repo has no Gradle wrapper — Android Studio generates one locally,
      # and its jar is a binary that doesn't belong in source control. CI runs a
      # pinned Gradle directly instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Without a stable key each run generates its own debug keystore, and the
      # phone then refuses every update as a signature mismatch — reported as a
      # bare "App not installed".
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret. Falling back to a per-run debug key; this build will NOT install over a previous one."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          # Unsigned only if the fallback above also failed to produce a key.
          src=app/build/outputs/apk/release/app-release.apk
          [ -f "$src" ] || src=app/build/outputs/apk/release/app-release-unsigned.apk
          cp "$src" "out/nearest-plane-${version}.apk"
          echo "path=out/nearest-plane-${version}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Published so a failed install can be told apart from a bad download.
          echo "sha=$(sha256sum "out/nearest-plane-${version}.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nearest-plane-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Release-build APK, self-signed, installable directly on a phone.

            **On your phone:** tap the `.apk` below, then allow installs from
            your browser when Android asks. No Android Studio, no USB cable.

            **Upgrading from v1.3 or earlier?** Uninstall the old one first.
            Everything up to v1.3 was signed with a throwaway key that changed
            on every build, so Android sees those as a different app and blocks
            the update. From v1.4 on, one key, and updates install cleanly.

            `SHA-256: ${{ steps.apk.outputs.sha }}`
            Doesn't match what you downloaded? The download is truncated —
            that's a broken file, not a broken build.
