name: Build APK

# Every push to main produces a downloadable APK. Pushing a v* tag also cuts a
# Release, which is the copy you want on your phone — release assets have a
# stable URL and don't expire, unlike workflow artifacts.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      # The repo has no Gradle wrapper — Android Studio generates one locally,
      # and its jar is a binary that doesn't belong in source control. CI runs a
      # pinned Gradle directly instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/nearest-plane-${version}.apk"
          echo "path=out/nearest-plane-${version}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nearest-plane-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Debug-signed APK, installable directly on a phone.

            **On your phone:** tap the `.apk` below, then allow installs from
            your browser when Android asks. No Android Studio, no USB cable.
